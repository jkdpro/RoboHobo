version: 0.1.0

defaults:
  max_results: 50
  sites:
    - olx

searches:
  - id: example-net
    enabled: true
    category: IT
      - .NET - mid or senior
      - prefer roles where API experience is not explicitely listed
      - disallow roles when python experience is required
    employment_type:
      - only full-time
    remote_work: false
    min_salary_pln: 8000
    max_results: 50
    notes: "Example only; replace with personal values."
  - id: example-data
    enabled: true
    category: IT
      - role described similar to: Database Developer, Data Scientist, Database administrator
      - prefer roles with experience in Microsoft SQL Server, MySQL, mariaDB, PostgreSQL
      - disallow roles with strong accent on Oracle PL/SQL
    employment_type:
      - prefer part-time
    remote_work: false
    min_salary_pln: 8000
    max_results: 50
    notes: "Example only; replace with personal values."
