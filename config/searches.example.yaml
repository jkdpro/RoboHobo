defaults:
  max_results: 50
  sites:
    - olx

searches:
  - id: example-net
    job_category:
      require:
        - IT
    criteria:
      require:
        - ".NET developer"
      exclude:
        - "Python experience is required"
      prefer:
        - "roles that do not explicitly list API experience"
    employment_type:
      require:
        - full_time
    work_mode:
      prefer:
        - remote
    notes: "Example only; replace with personal values."
  - id: example-data
    job_category:
      require:
        - IT
    criteria:
      require:
        - "Database Developer or similar"
        - "Data Scientist or similar"
        - "Database Administrator or similar"
      prefer:
        - "experience with any of Microsoft SQL Server, MySQL, MariaDB, PostgreSQL"
      deprioritize:
        - "strong emphasis on Oracle PL/SQL"
    employment_type:
      prefer:
        - part_time
    max_results: 25
    notes: "Example only; replace with personal values."
