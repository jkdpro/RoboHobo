version: 0.1.0

defaults:
  max_results: 50
  sites:
    - olx

searches:
  - id: example-net
    enabled: true
    category: IT
    role:
      must:
        - ".NET developer, mid or senior"
      prefer:
        - "API experience is not explicitly listed"
      avoid:
        - "Python experience is required"
    employment_type:
      required:
        - full-time
    remote: onsite_only
    min_salary_pln: 8000
    max_results: 50
    notes: "Example only; replace with personal values."
  - id: example-data
    enabled: true
    category: IT
    role:
      must:
        - "role similar to: Database Developer, Data Scientist, Database Administrator"
      prefer:
        - "experience with Microsoft SQL Server, MySQL, MariaDB, PostgreSQL"
      avoid:
        - "strong focus on Oracle PL/SQL"
    employment_type:
      preferred:
        - part-time
    remote: onsite_only
    min_salary_pln: 8000
    max_results: 50
    notes: "Example only; replace with personal values."
