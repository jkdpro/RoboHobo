schema_version: 0

defaults:
  max_results: 50
  sites:
    - olx

searches:
  - id: example-net
    enabled: true
    category: IT
    criteria:
      - ".NET - mid or senior"
      - "prefer roles where API experience is not explicitly listed"
      - "disallow roles when python experience is required"
    employment_type:
      - only full-time
    remote_work: false
    min_salary_pln: 8000
    max_results: 50
    notes: "Example only; replace with personal values."
  - id: example-data
    enabled: true
    category: IT
    criteria:
      - "role described similar to: Database Developer, Data Scientist, Database Administrator"
      - "prefer roles with experience in Microsoft SQL Server, MySQL, MariaDB, PostgreSQL"
      - "disallow roles with strong accent on Oracle PL/SQL"
    employment_type:
      - prefer part-time
    remote_work: false
    min_salary_pln: 8000
    max_results: 50
    notes: "Example only; replace with personal values."
